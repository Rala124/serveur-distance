<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Panel - Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d14;
            position: relative;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(30, 58, 95, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(20, 80, 60, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: #11141d;
            border: 1px solid #1e2233;
            border-radius: 16px;
            padding: 48px 36px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: rgba(30, 58, 95, 0.2);
            border: 1px solid rgba(40, 80, 130, 0.25);
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .logo-icon svg {
            color: #4a8ab5;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #e4e6ed;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 13px;
            color: #5f6377;
            margin-top: 8px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #8b8fa5;
            font-size: 13px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #161923;
            border: 1px solid #222636;
            border-radius: 10px;
            color: #e4e6ed;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-group input::placeholder {
            color: #3d4155;
        }

        .form-group input:focus {
            border-color: #3a6d95;
            box-shadow: 0 0 0 3px rgba(58, 109, 149, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #1e3a5f;
            border: 1px solid rgba(58, 109, 149, 0.3);
            border-radius: 10px;
            color: #c8d8e8;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.2px;
        }

        .login-btn:hover {
            background: #254a75;
            border-color: rgba(74, 138, 181, 0.4);
            color: #e4e6ed;
        }

        .login-btn:active {
            transform: scale(0.985);
        }

        .error-message {
            background: rgba(242, 95, 92, 0.08);
            border: 1px solid rgba(242, 95, 92, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 24px;
            color: #e57373;
            text-align: center;
            font-size: 13px;
        }

        .divider-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #222636, transparent);
            margin: 28px 0;
        }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: #3d4155;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="6"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                </div>
                <div class="logo-text">C2 Panel</div>
                <div class="logo-sub">Administration a distance</div>
            </div>
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" name="username" placeholder="admin" required autofocus>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="password" placeholder="Entrez votre mot de passe" required>
                </div>
                <button type="submit" class="login-btn">Se connecter</button>
            </form>
            <div class="divider-line"></div>
            <div class="footer-text">Acces reserve aux administrateurs autorises</div>
        </div>
    </div>
</body>
</html>
