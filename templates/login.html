<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Panel - Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background: linear-gradient(135deg,#0a0e1a,#0f1322); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-container { width:100%; max-width:420px; padding:20px; }
        .login-card { background:#0f1322; border:1px solid #1a1f2e; border-radius:24px; padding:40px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); }
        .logo { text-align:center; margin-bottom:32px; }
        .logo-icon { font-size:48px; }
        .logo-text { font-size:24px; font-weight:700; background:linear-gradient(135deg,#6366f1,#8b5cf6); -webkit-background-clip:text; color:transparent; }
        .logo-sub { font-size:13px; color:#6b7280; margin-top:8px; }
        .form-group { margin-bottom:24px; }
        .form-group label { display:block; margin-bottom:8px; color:#9ca3af; font-size:14px; }
        .form-group input { width:100%; padding:12px 16px; background:#1a1f2e; border:1px solid #2d3348; border-radius:12px; color:#e0e0e0; font-size:14px; }
        .login-btn { width:100%; padding:12px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border:none; border-radius:12px; color:white; font-size:16px; font-weight:600; cursor:pointer; }
        .error-message { background:rgba(248,113,113,0.15); border:1px solid rgba(248,113,113,0.3); border-radius:12px; padding:12px; margin-bottom:24px; color:#f87171; text-align:center; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <span class="logo-icon">🎯</span>
                <div class="logo-text">C2 Panel</div>
                <div class="logo-sub">Administration à distance</div>
            </div>
            {% if error %}
            <div class="error-message">⚠️ {{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" name="username" placeholder="admin" required autofocus>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-btn">Se connecter</button>
            </form>
        </div>
    </div>
</body>
</html>
